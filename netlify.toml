
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'nonce-{{NEXT_NONCE}}' https://www.googletagmanager.com https://pagead2.googlesyndication.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://picsum.photos; font-src 'self' data:; connect-src 'self' vitals.vercel-insights.com; frame-src 'self' https://googleads.g.doubleclick.net; frame-ancestors 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests;"

    